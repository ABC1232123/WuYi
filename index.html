<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wuyi.quest | 约稿排单处</title>
    <style>
        /* 整体页面风格 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f5f7; 
            color: #333;
            max-width: 760px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            line-height: 1.7;
        }
        
        /* 顶部标题 */
        h1 {
            font-size: 2.2em;
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* 卡片式的内容区块 */
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            font-size: 1.3em;
            color: #1a73e8;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 10px;
            margin-top: 0;
        }

        p, li { color: #444; }
        
        /* 强调文字 */
        .highlight { color: #d35400; font-weight: bold; }
        
        hr { 
            margin: 40px 0; 
            border: 0; 
            border-top: 1px dashed #ccc; 
        }
        
        /* 留言板标题 */
        .comment-title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>wuyi 的约稿排单处</h1>
    <p class="subtitle">感谢你的喜欢与支持！</p>

    <div class="card">
        <h2>📌 约稿流程</h2>
        <p>1. 在下方留言板填写你的<strong>联系方式（邮箱必填）</strong>。</p>
        <p>2. 留下你对稿件的具体需求（如：角色设定、画面内容、参考图链接等）。</p>
        <p>3. 看到留言后，我会尽快通过你留下的邮箱或私信联系你确认排单。</p>
    </div>

    <div class="card">
        <h2>⚠️ 注意事项</h2>
        <ul>
            <li>请尽量把需求描述清楚，如果有参考图，可以发图片链接（比如挂在图床或微博上的链接）。</li>
            <li>排单顺序以确认收到定金的时间为准。</li>
            <li>如果在留言板不方便发图，可以先留个联系方式，我们私下详聊。</li>
        </ul>
    </div>

    <hr>

    <div class="card">
        <h2 class="comment-title">📝 填写你的排单信息</h2>
        <p style="text-align: center; font-size: 0.9em; color: #888; margin-bottom: 20px;">无需注册，填写昵称和邮箱即可留言排单。</p>
        
        <!-- Waline 评论区代码 -->
        <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
        <div id="waline"></div>
        <script type="module">
          import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
          init({
            el: '#waline',
            serverURL: 'https://wuyi551.vercel.app', 
            meta: ['nick', 'mail', 'link'], 
            requiredMeta: ['nick', 'mail'], // 设置了昵称和邮箱必填，方便你联系客户
            locale: {
              placeholder: '请在这里写下你的约稿需求、联系方式或想说的话...', // 修改了输入框的提示语
            }
          });
        </script>
    </div>

</body>
</html>
