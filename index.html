<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wuyi.quest | 约稿排单处</title>
    <style>
        /* ================= 整体页面风格 ================= */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* 极简好看的渐变背景 */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            background-attachment: fixed;
            color: #333;
            margin: 0; 
            padding: 40px 20px; 
            line-height: 1.8;
            min-height: 100vh;
        }
        
        /* 内容居中容器 */
        .container {
            max-width: 760px; 
            margin: 0 auto; 
        }

        /* ================= 顶部标题区 ================= */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.8em;
            color: #2c3e50;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        /* ================= 毛玻璃卡片 ================= */
        .card {
            background: rgba(255, 255, 255, 0.85); /* 半透明白色 */
            backdrop-filter: blur(10px); /* 毛玻璃模糊效果 */
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            font-size: 1.4em;
            color: #34495e;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 12px;
            margin-top: 0;
        }

        p, li { color: #4a5568; }
        
        /* 列表美化 */
        ul { padding-left: 20px; }
        li { margin-bottom: 12px; }
        
        /* 强调文字 */
        .highlight { 
            color: #e53e3e; 
            font-weight: bold; 
        }

        /* ================= 留言板深度美化 (Waline 专属覆盖) ================= */
        /* 隐藏原生难看的边框，统一圆角 */
        .wl-panel {
            border-radius: 12px !important;
            border: 1px solid #e2e8f0 !important;
            background: #ffffff !important;
        }
        /* 输入框聚焦时的高亮 */
        .wl-editor:focus, .wl-input:focus {
            border-color: #667eea !important;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2) !important;
        }
        /* 发送按钮改成渐变色 */
        .wl-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border: none !important;
            border-radius: 8px !important;
            font-weight: 500 !important;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .wl-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.3) !important;
        }
        /* 评论区文字大小 */
        .wl-content {
            font-size: 15px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>wuyi 的约稿排单处</h1>
        <p class="subtitle">感谢你的喜欢与支持 ✨</p>
    </div>

    <div class="card">
        <h2>📌 约稿流程</h2>
        <p>1. 在下方留言板填写你的<strong>联系方式（邮箱必填）</strong>。</p>
        <p>2. 留下你对稿件的具体需求（如：角色设定、画面内容、参考图链接等）。</p>
        <p>3. 看到留言后，我会尽快通过你留下的邮箱或私信联系你确认排单。</p>
    </div>

    <div class="card">
        <h2>⚠️ 注意事项</h2>
        <ul>
            <li>请尽量把需求描述清楚，如果有参考图，可以发图片链接（比如挂在图床或微博上的链接）。</li>
            <li>排单顺序以确认收到定金的时间为准。</li>
            <li>如果在留言板不方便发图，可以先留个联系方式，我们私下详聊。</li>
        </ul>
    </div>

    <div class="card">
        <h2 style="text-align: center; border: none; color: #667eea; margin-bottom: 5px;">📝 填写你的排单信息</h2>
        <p style="text-align: center; font-size: 0.9em; color: #888; margin-bottom: 25px;">无需注册，填写昵称和邮箱即可留言排单。</p>
        
        <!-- Waline 评论区代码 -->
        <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
        <div id="waline"></div>
        <script type="module">
          import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
          init({
            el: '#waline',
            serverURL: 'https://comment.wuyi.quest', 
            meta: ['nick', 'mail', 'link'], 
            requiredMeta: ['nick', 'mail'], 
            locale: {
              placeholder: '请在这里写下你的约稿需求、联系方式或想说的话...',
            }
          });
        </script>
    </div>
</div>

</body>
</html>
